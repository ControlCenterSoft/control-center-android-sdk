name: Android SDK CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ops/**'
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build, lint and unit tests
        run: gradle --no-daemon lint test assembleDebug

  record-result:
    if: ${{ always() && github.event_name == 'push' }}
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record CI result
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              'schema': 1,
              'recorded_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'source_sha': os.environ['SOURCE_SHA'],
              'run_id': os.environ['RUN_ID'],
              'validate': os.environ['VALIDATE_RESULT'],
          }
          with open('ops/ci-status.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2)
              fh.write('\n')
          PY
          git config user.name 'control-center-android-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -- ops/ci-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Android SDK CI result'
          git pull --rebase origin main
          git push origin HEAD:main
